[versions]
# project properties
projectGroup="cn.aiclr"
projectVersion="1.0.0-SNAPSHOT"
projectDesc="Demo project for Spring AI"

spring-boot = "3.5.8"
#spring-dependency-management = "1.1.7"
spring-ai = "1.0.0"

[libraries]
# implementation platform(libs.spring.boot.dependencies)
# testImplementation platform(libs.spring.boot.dependencies)
spring-boot-dependencies={module="org.springframework.boot:spring-boot-dependencies",version.ref="spring-boot"}

# implementation (libs.spring.boot.starter.web)
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web"}

# Spring AI
# implementation platform(libs.spring.ai.bom)
# testImplementation platform(libs.spring.ai.bom)
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai" }

# implementation (libs.spring.ai.openai)
spring-ai-openai = { module = "org.springframework.ai:spring-ai-openai"}
# implementation (libs.spring.ai.ollama)
spring-ai-ollama = { module = "org.springframework.ai:spring-ai-ollama"}


spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test"}

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }

# spring-dependency-management 使用 implementation platform(libs.spring.boot.dependencies) 代替
#spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

[bundles]

spring-ai-bundle = ["spring-ai-openai", "spring-ai-ollama"]
testing = ["spring-boot-starter-test"]